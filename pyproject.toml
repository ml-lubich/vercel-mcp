[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vercel-mcp"
version = "0.3.0"
description = "Manage multiple Vercel CLI logins on one machine, and let AI agents switch between them via MCP."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Misha Lubich", email = "misha@lupfr.com" },
]
keywords = ["vercel", "cli", "mcp", "devops", "multi-account", "deployment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    # Upper bound is load-bearing: mcp 2.x renamed FastMCP to MCPServer and
    # moved mcp.server.fastmcp, so an unpinned install silently breaks the
    # server — it surfaces only as "Connection closed" in the MCP host.
    # Lift this together with the migration to MCPServer, not before.
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
]

[project.scripts]
vgate = "vercel_mcp.cli:main"
vgate-mcp = "vercel_mcp.mcp_server:main"

[project.urls]
Homepage = "https://github.com/ml-lubich/vercel-mcp"
Repository = "https://github.com/ml-lubich/vercel-mcp"
Issues = "https://github.com/ml-lubich/vercel-mcp/issues"
Changelog = "https://github.com/ml-lubich/vercel-mcp/releases"

[tool.hatch.build.targets.wheel]
packages = ["vercel_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=vercel_mcp --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["vercel_mcp"]
